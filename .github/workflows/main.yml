name: Deploy ShopZone
on:
    push:
        branches:
            - main

premissions:
  contents: red
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name/: Step Node
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      -name: Build
        run: npm run build

      - name: Setup pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name:Deploy
        uses: actions/deploy-pages@v4
  
     
